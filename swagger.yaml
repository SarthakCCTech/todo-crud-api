
openapi: 3.0.3

info:
  title: Todo API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /todos:
    get:
      summary: Get all todos
      responses:
        "200":
          description: List of todos

    post:
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Todo created

  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get a todo by ID
      responses:
        "200":
          description: Todo found
        "404":
          description: Todo not found

    put:
      summary: Update a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                is_completed:
                  type: boolean
      responses:
        "200":
          description: Todo updated
        "404":
          description: Todo not found

    delete:
      summary: Delete a todo
      responses:
        "204":
          description: Todo deleted
        "404":
          description: Todo not found
